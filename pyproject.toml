[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grydgets"
version = "0.1.0"
description = "A PyGame-based widget dashboard system with configurable grid layouts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pygame-ce",
    "requests",
    "voluptuous",
    "pyyaml",
    "jq",
    "flask",
    "ruamel.yaml",
    "jsonschema",
]

[project.scripts]
grydgets = "grydgets.cli:main"
grydgets-editor = "grydgets.editor.app:main"

[tool.pytest.ini_options]
# Only test_*.py. Pytest's other default pattern, *_test.py, matches
# grydgets/editor/rest_test.py -- a module, not a test file -- and collects
# its test_rest/test_image helpers as broken tests.
python_files = ["test_*.py"]
