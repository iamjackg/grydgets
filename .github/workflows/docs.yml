name: Docs

on:
  push:
    branches: [master, docs-site]
  pull_request:
  workflow_dispatch:

# Only the docs build needs to read the repository. The deploy job asks for the
# extra permissions Pages requires.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

# Actions are pinned to a commit rather than a tag, since a tag can be moved to
# point at different code after the fact. The comment is the tag that commit
# carried when it was pinned.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.12"
          enable-cache: true

      # --locked fails instead of re-resolving, so the build uses exactly the
      # versions and hashes in uv.lock. --no-install-project skips grydgets
      # itself: the site build doesn't import it, and there's no reason to
      # install pygame in CI.
      - run: uv sync --only-group docs --no-install-project --locked

      - run: .venv/bin/mkdocs build --strict

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    # Pull requests get the build as a check, but only master and docs-site are
    # published.
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/docs-site') && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
